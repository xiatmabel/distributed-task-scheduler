services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_create_tasks.sql:/docker-entrypoint-initdb.d/001_create_tasks.sql:ro

  api:
    build:
      context: .
      args:
        APP: api
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler
      HTTP_ADDR: :8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      args:
        APP: worker
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler
      POLL_INTERVAL: 1s
      WORKER_ID: worker-1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:

